slo:
  name: "Chat API Latency SLO"
  description: "95% of requests must complete within 500ms P95 latency over 30-day rolling window"
  
  # SLO Target: 95% of requests meet the latency target
  objective: 0.95
  
  # Time window for calculation
  window_days: 30
  
  # Target metric and acceptable value
  target_metric: "p95_latency_ms"
  target_value_ms: 500
  
  # Error budget calculation
  error_budget:
    total_error_allowance: 0.05  # 5% of requests can exceed 500ms
    consumed_percent: 0.02  # ~2% consumed from recent metrics
    remaining_percent: 0.03  # ~3% remaining budget
    
  # Consequences if SLO breached
  breached_actions:
    - "Page on-call engineer"
    - "Trigger incident response"
    - "Pause new feature deployments"
    - "Increase monitoring frequency to 1s"
